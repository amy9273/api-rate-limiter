services:
  rate-limiter:
    build: .
    container_name: api_rate_limiter
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      UPSTREAM_TARGET_URL: "http://host.docker.internal:8081"
      RATE_LIMIT_CAPACITY: 50
      RATE_LIMIT_REFILL_PER_SECOND: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
