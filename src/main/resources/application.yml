server:
  port: 8080

spring:
  application:
    name: api-rate-limiter
  threads:
    virtual:
      enabled: true

rate-limiter:
  default-capacity: 50
  default-refill-rate: 10
  bucket-ttl: 10m
  cleanup-interval: 60s
  cleanup-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
